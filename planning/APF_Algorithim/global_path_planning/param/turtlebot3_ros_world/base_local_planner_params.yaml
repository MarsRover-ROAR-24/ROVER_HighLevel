TebLocalPlannerROS:

  odom_topic: odom 
  # map_frame: map

  # Trajectory
  
  teb_autosize: True
  dt_ref: 0.3
  dt_hysteresis: 0.1 #--> 10% of dt_hysteresis
  global_plan_overwrite_orientation: False #-->true
  max_global_plan_lookahead_dist: 4.0 
  feasibility_check_no_poses: 2 #->default 4
  # force_reinit_new_goal_dist: 0.5
  # shrink_horizon_backup: True
  via_points_ordered: True # path following. false increases oscillation around the path
  # publish_feedback: True #Publish planner feedback containing the full trajectory and a list of active obstacles (should be enabled only for evaluation or debugging). See list of publishers above. 


 # Obstacles
    
  min_obstacle_dist: 0.15
  include_costmap_obstacles: True
  obstacle_poses_affected: 3
  # legacy_obstacle_association: True
  costmap_obstacles_behind_robot_dist: 2.0
  # obstacle_poses_affected: 30
  costmap_converter_plugin: ""   # Define plugin name in order to convert costmap cells to points/lines/polygons. Set an empty string to disable the conversion such that all cells are treated as point-obstacles.
  costmap_converter_spin_thread: True
  costmap_converter_rate: 5  # Rate that defines how often the costmap_converter plugin processes the current costmap (the value should not be much higher than the costmap update rate) [in Hz]
  # include_dynamic_obstacles: True #If this parameter is set to true, the motion of obstacles with non-zero velocity (provided via user-supplied obstacles on topic ~/obstacles or obtained from the costmap_converter) is predicted and considered during optimization via a constant velocity model. New

 # Optimization
    
  no_inner_iterations: 3
  no_outer_iterations: 3
  optimization_activate: True
  optimization_verbose: False
  penalty_epsilon: 0.15
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 1
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 1
  weight_obstacle: 20
  weight_via_point: 10 # New in version 0.4-->100
  weight_dynamic_obstacle: 10 # not in use yet
  selection_alternative_time_cost: False # not in use yet

   # Homotopy Class Planner

  enable_homotopy_class_planning: True #--> it was true but i read that enabling it to flase would solve the problem of warnings
  enable_multithreading: True
  simple_exploration: False
  max_number_classes: 4
  # selection_cost_hysteresis: 1.0
  # selection_obst_cost_scale: 1.0
  # selection_alternative_time_cost: False
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5
  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1
  obstacle_keypoint_offset: 0.1
  obstacle_heading_threshold: 0.45
  visualize_hc_graph: False

# Goal Tolerance Parameters-->
  xy_goal_tolerance: 0.05  # Maximum allowable deviation in robot position from the goal position.
  yaw_goal_tolerance: 0.17 # Specifies the maximum allowable angular deviation in the robot orientation from the goal orientation.
  free_goal_vel: False # when set to false removes the goal velocity constraint such that the robot can arrive at the goal with maximum velocity.

#FootPrint_Model
  max_vel_x: 0.22
  min_vel_x: -0.22
  max_vel_x_backwards: 0.16
  max_vel_theta: 2.75 #-->1.0
  min_vel_theta: 1.37
  acc_lim_x: 2.5 #0.16
  acc_lim_theta: 3.2 #-->0.3
  min_turning_radius: 0.0 # Minimum turning radius of a carlike robot (set to zero for a diff-drive robot). -->0.5
  cmd_angle_instead_rotvel: False 

  footprint_model: # types: "point", "circular", "line", "two_circles", "polygon"
    type: "point"
    # radius: 0.2 # for type "circular"
  control_look_ahed_poses: 3
    # line_start: [-0.3, 0.0] # for type "line"
    # line_end: [0.3, 0.0] # for type "line"
    # front_offset: 0.2 # for type "two_circles"
    # front_radius: 0.2 # for type "two_circles"
    # rear_offset: 0.2 # for type "two_circles"
    # rear_radius: 0.2 # for type "two_circles"
    # vertices: [ [0.25, -0.05], [0.18, -0.05], [0.18, -0.18], [-0.19, -0.18], [-0.25, 0], [-0.19, 0.18], [0.18, 0.18], [0.18, 0.05], [0.25, 0.05] ] # for type "polygon"
  

