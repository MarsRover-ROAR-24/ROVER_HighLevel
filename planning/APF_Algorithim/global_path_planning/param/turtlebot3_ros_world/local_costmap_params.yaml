################---------------###############

local_costmap:
  global_frame: map 
  robot_base_frame: base_link #base_footprint
  update_frequency: 2.0 #5.0
  publish_frequency: 2.0
  static_map: false 
  rolling_window: true
  width: 2.0
  height: 2.0
  resolution: 0.05 #-->0.1

  transform_tolerance: 0.5


  plugins:
   - {name: static_layer,        type: "costmap_2d::StaticLayer"}
   - {name: obstacle_layer,      type: "costmap_2d::ObstacleLayer"} #it was made to VoxelLayer


