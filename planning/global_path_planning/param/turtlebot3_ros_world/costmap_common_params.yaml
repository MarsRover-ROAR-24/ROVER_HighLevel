max_obstacle_height: 1.5 #-->0.60  # assume something like an arm is mounted on top of the robot

# Obstacle Cost Shaping (http://wiki.ros.org/costmap_2d/hydro/inflation)
robot_radius: 0.15  # 0.225/distance a circular robot should be clear of the obstacle (kobuki: 0.18)
# footprint: [[-0.105, -0.105], [-0.105, 0.105], [0.041, 0.105], [0.041, -0.105]]
map_type: costmap #--> added
publish_voxel_map: false #->i set to true to just try


# plugins:
#   - {name: static_layer, type: "costmap_2d::StaticLayer"}
#   - {name: obstacles_layer, type: "costmap_2d::VoxelLayer"}
#   - {name: inflater_layer, type: "costmap_2d::InflationLayer"}

obstacle_layer:
  enabled:              true
  max_obstacle_height:  0.6
  origin_z:             0.0
  z_resolution:         0.5
  z_voxels:             2
  unknown_threshold:    15
  mark_threshold:       0
  combination_method:   1
  track_unknown_space:  true    #true needed for disabling global path planning through unknown space
  obstacle_range: 3.0
  raytrace_range: 3.5
  origin_z: 0.0

 
  observation_sources:  scan #bump
  # scan: {sensor_frame: base_scan , data_type: LaserScan, topic: /scan, marking: true, clearing: true, inf_is_valid: true} #sensor_frame: base_scan/added
  scan: {sensor_frame: kinect_body , data_type: LaserScan, topic: /scan, marking: true, clearing: true, inf_is_valid: true}

#cost_scaling_factor and inflation_radius were now moved to the inflation_layer ns
inflation_layer:
  enabled:              true
  cost_scaling_factor:  3.0  # exponential rate at which the obstacle cost drops off (default: 10)
  inflation_radius:     1.0  # 0.2 /max. distance from an obstacle at which costs are incurred for planning paths.
  # inscribed_radius: 0.15

static_layer:
  enabled:              true
  map_topic:            "/map" #-->