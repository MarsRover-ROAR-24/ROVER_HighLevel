transform_tolerance: 0.2
map_type: costmap

obstacle_layer:
 enabled: true
 obstacle_range: 3.0
 raytrace_range: 3.5
 inflation_radius: 0.4
 track_unknown_space: false
 combination_method: 1

footprint: [[-0.105, -0.105], [-0.105, 0.105], [0.041, 0.105], [0.041, -0.105]] #-->
robot_radius: 0.2

# inflation_radius: 1.0
# cost_scaling_factor: 3.0


observation_sources: scan
scan: {sensor_frame: base_scan, data_type: LaserScan, topic: scan,expected_update_rate: 0.5, observation_persistence: 0.0, marking: true, clearing: true, min_obstacle_height: 0.00, max_obstacle_height: 3.00}


inflation_layer:
  enabled:              true
  cost_scaling_factor:  10.0  # exponential rate at which the obstacle cost drops off (default: 10)
  inflation_radius:     0.38  # max. distance from an obstacle at which costs are incurred for planning paths.

static_layer:
  enabled:              true
  map_topic:            "/map"

